# Copyright The Project Template Contributors

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: Template checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            range="HEAD^1..HEAD"
          else
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          fi

          missing=0
          for commit in $(git rev-list --no-merges "$range"); do
            if ! git log -1 --format=%B "$commit" | grep -qi '^Signed-off-by:'; then
              echo "::error title=Missing DCO sign-off::Commit $commit does not contain a Signed-off-by trailer."
              missing=1
            fi
          done

          exit "$missing"

      - name: Install pre-commit
        run: |
          python3 -m pip install --disable-pip-version-check pre-commit

      - name: Run template checks
        run: |
          git status --short --branch
          git grep -n -E 'TODO|YYYY-MM-DD|@TODO-owner' -- . || [ "$?" -eq 1 ]
          pre-commit run --all-files
